<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Soft outer glow on the star -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-corner background -->
  <rect width="32" height="32" rx="7" ry="7" fill="#0a0a14"/>

  <!-- ✦ 4-pointed star — same geometry as the PNG generator -->
  <!-- Outer tips at top/right/bottom/left; inner corners at 45° between -->
  <path
    d="M16 3.5
       L18.97 13.03
       L28.5 16
       L18.97 18.97
       L16 28.5
       L13.03 18.97
       L3.5 16
       L13.03 13.03
       Z"
    fill="#00ffaa"
    filter="url(#glow)"
  />
</svg>
